<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if site_banner %}<div class="site-banner" role="status">{{ site_banner }}</div>{% endif %}
  <header class="site">
    <div class="wrap">
      <a class="logo" href="/status"><span class="logo-mark" aria-hidden="true"></span>{{ brand }}</a>
      <nav>
        <a href="/status">Status</a>
        <a href="/chart">Chart</a>
        <a href="/analytics">Analytics</a>
        <a href="/performance">Track record</a>
        <form method="post" action="/logout"><button class="nav-btn" type="submit">Sign out</button></form>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer class="site">
    <div class="wrap">
      <p>Private dashboard. Backtest and past results don't guarantee future results; gold is leveraged and volatile.</p>
    </div>
  </footer>
</body>
</html>
